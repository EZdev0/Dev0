version: "3.9"

services:
  dev0-sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    container_name: dev0-user-sandbox
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777
      - /workspace:size=256M,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    environment:
      - SANDBOX_MODE=docker_isolated
      - NO_HOST_FS_ACCESS=1
